name: corpus-contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component clippy,rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Build release
        run: cargo build --locked --release
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install pinned Rust
        run: rustup toolchain install 1.90.0 --profile minimal
      - run: cargo build --locked
      - run: npm ci --prefix ui
      - run: npm run build --prefix ui
      - run: npm audit --prefix ui --audit-level=low
      - name: Install isolated Chromium
        working-directory: ui
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e --prefix ui
      - name: Install pinned advisory audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --deny warnings

name: container-contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native-container:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
            machine: x86_64
          - runner: ubuntu-24.04-arm
            architecture: arm64
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify native runner architecture
        run: test "$(uname -m)" = '${{ matrix.machine }}'
      - name: Test and build immutable tracked source
        run: python3 scripts/build-containers.py --platform linux/${{ matrix.architecture }} --tag corpus-workbench:ci
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
      - run: npm ci --prefix ui
      - name: Install isolated Chromium
        working-directory: ui
        run: npx playwright install --with-deps chromium
      - name: Test persistent runtime and actual browser
        run: python3 scripts/container-smoke.py --image corpus-workbench:ci --port 18920 --out .runtime/container-ci.local.json --browser

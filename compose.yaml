name: corpus-workbench
x-runtime: &runtime
  image: ${WB_IMAGE:-corpus-workbench:local}
  user: '10001:10001'
  read_only: true
  tmpfs: ['/tmp:rw,noexec,nosuid,size=64m,mode=1777']
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  mem_limit: 1g
  cpus: 2
  environment:
    WB_PORT: ${WB_PORT:-18920}
    WB_PROJECT: ${WB_PROJECT:-synthetic}
    WB_STORE: ${WB_STORE:-/data/authority}
  volumes:
    - authority:/data/authority
    - runtime:/data/.runtime
services:
  authoring:
    <<: *runtime
    build:
      context: .
      target: runtime
      args:
        SOURCE_COMMIT: ${WB_SOURCE_COMMIT:-working-tree}
    ports:
      - '127.0.0.1:${WB_PORT:-18920}:${WB_PORT:-18920}'
    restart: 'no'
  tools:
    <<: *runtime
    profiles: [tools]
    network_mode: none
    healthcheck:
      disable: true
    volumes:
      - authority:/data/authority
      - runtime:/data/.runtime
      - backups:/backups
    command: [check, --store, /data/authority]
volumes:
  authority:
  runtime:
  backups:

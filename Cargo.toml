[package]
name = "corpus-workbench"
version = "0.2.0-dev.9"
edition = "2021"
rust-version = "1.90"
license = "GPL-3.0-or-later"
description = "Research-intelligence corpus authoring core with lossless TEITOK compatibility"
repository = "https://github.com/Open-K-Folds/corpus-workbench"

[profile.release]
strip = "symbols"

[dependencies]
anyhow = "=1.0.103"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
uuid = { version = "=1.18.1", features = ["v4"] }
roxmltree = "=0.20.0"
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
walkdir = "=2.5.0"
tiny_http = "=0.12.0"
zip = { version = "=0.6.6", default-features = false }

[dev-dependencies]
tempfile = "=3.23.0"

